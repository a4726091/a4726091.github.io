function escapeMarkdownHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function convertMarkdownToHtml(markdown) {
    let text = escapeMarkdownHtml(markdown);

    // 統一換行符號
    text = text.replace(/\r\n?/g, '\n');

    // 程式碼區塊 ```code```
    const codeBlocks = [];

    text = text.replace(/```([\s\S]*?)```/g, function(match, code) {
        const index = codeBlocks.length;

        codeBlocks.push(
            '<pre><code>' +
            code.replace(/^\n|\n$/g, '') +
            '</code></pre>'
        );

        return `%%CODE_BLOCK_${index}%%`;
    });

    // 標題
    text = text.replace(/^######\s+(.+)$/gm, '<h6>$1</h6>');
    text = text.replace(/^#####\s+(.+)$/gm, '<h5>$1</h5>');
    text = text.replace(/^####\s+(.+)$/gm, '<h4>$1</h4>');
    text = text.replace(/^###\s+(.+)$/gm, '<h3>$1</h3>');
    text = text.replace(/^##\s+(.+)$/gm, '<h2>$1</h2>');
    text = text.replace(/^#\s+(.+)$/gm, '<h1>$1</h1>');

    // 水平線
    text = text.replace(
        /^(?:---+|\*\*\*+|___+)$/gm,
        '<hr>'
    );

    // 引用
    text = text.replace(
        /^&gt;\s?(.+)$/gm,
        '<blockquote>$1</blockquote>'
    );

    // 核取方塊
    text = text.replace(
        /^[-*]\s+\[x\]\s+(.+)$/gim,
        '<div class="markdown-task">' +
        '<input type="checkbox" checked disabled> $1' +
        '</div>'
    );

    text = text.replace(
        /^[-*]\s+\[\s\]\s+(.+)$/gim,
        '<div class="markdown-task">' +
        '<input type="checkbox" disabled> $1' +
        '</div>'
    );

    // 無序清單
    text = convertMarkdownLists(text, false);

    // 有序清單
    text = convertMarkdownLists(text, true);

    // 卡片連結：[[顯示標題|cardId]]
text = text.replace(
    /\[\[([^\]|]+)\|([^\]]+)\]\]/g,
    function(match, title, cardId) {
        const safeTitle =
            escapeCardLinkText(title.trim());

        const safeCardId =
            escapeCardLinkText(cardId.trim());

        return (
            '<a ' +
            `href="#card/${encodeURIComponent(cardId.trim())}" ` +
            'class="internal-card-link" ' +
            `data-card-id="${safeCardId}" ` +
            'contenteditable="false">' +
            safeTitle +
            '</a>'
        );
    }
);
    // 圖片，必須放在一般連結之前
    text = text.replace(
        /!\[([^\]]*)\]\((https?:\/\/[^\s)]+)\)/g,
        '<img src="$2" alt="$1" style="max-width:100%; height:auto;">'
    );

    // 一般連結
    text = text.replace(
        /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
        '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>'
    );

    // 粗斜體
    text = text.replace(
        /\*\*\*(.+?)\*\*\*/g,
        '<strong><em>$1</em></strong>'
    );

    // 粗體
    text = text.replace(
        /\*\*(.+?)\*\*/g,
        '<strong>$1</strong>'
    );

    text = text.replace(
        /__(.+?)__/g,
        '<strong>$1</strong>'
    );

    // 斜體
    text = text.replace(
        /(?<!\*)\*([^*\n]+)\*(?!\*)/g,
        '<em>$1</em>'
    );

    // 刪除線
    text = text.replace(
        /~~(.+?)~~/g,
        '<del>$1</del>'
    );

    // 行內程式碼
    text = text.replace(
        /`([^`\n]+)`/g,
        '<code>$1</code>'
    );

    // 還原程式碼區塊
    codeBlocks.forEach(function(codeBlock, index) {
        text = text.replace(
            `%%CODE_BLOCK_${index}%%`,
            codeBlock
        );
    });

    // 將剩餘純文字換行轉成 div
    text = text
        .split('\n')
        .map(function(line) {
            const trimmedLine = line.trim();

            if (!trimmedLine) {
                return '<div><br></div>';
            }

            // 已轉換成區塊元素的內容不再包 div
            if (
                /^<(h[1-6]|ul|ol|li|blockquote|pre|hr|div)/i.test(
                    trimmedLine
                )
            ) {
                return line;
            }

            return `<div>${line}</div>`;
        })
        .join('');

    return text;
}

function convertMarkdownLists(text, ordered) {
    const lines = text.split('\n');
    const output = [];

    let insideList = false;
    const listTag = ordered ? 'ol' : 'ul';

    const pattern = ordered
        ? /^\s*\d+\.\s+(.+)$/
        : /^\s*[-*+]\s+(.+)$/;

    lines.forEach(function(line) {
        const match = line.match(pattern);

        if (match) {
            if (!insideList) {
                output.push(`<${listTag}>`);
                insideList = true;
            }

            output.push(`<li>${match[1]}</li>`);
        } else {
            if (insideList) {
                output.push(`</${listTag}>`);
                insideList = false;
            }

            output.push(line);
        }
    });

    if (insideList) {
        output.push(`</${listTag}>`);
    }

    return output.join('\n');
}

function containsMarkdownSyntax(text) {
    const patterns = [
        /^#{1,6}\s+\S/m,              // 標題
        /\*\*[^*\n]+\*\*/,            // 粗體
        /__[^_\n]+__/,                 // 粗體
        /~~[^~\n]+~~/,                 // 刪除線
        /`[^`\n]+`/,                   // 行內程式碼
        /```[\s\S]*?```/,              // 程式碼區塊
        /^\s*[-*+]\s+\S/m,             // 無序清單
        /^\s*\d+\.\s+\S/m,             // 有序清單
        /^&gt;\s+\S/m,                 // 已轉義引用
        /^>\s+\S/m,                    // 引用
        /\[[^\]]+\]\(https?:\/\/.+?\)/,// 連結
        /!\[[^\]]*\]\(https?:\/\/.+?\)/,// 圖片
        /^[-*]\s+\[[ xX]\]\s+\S/m      // 核取方塊
    ];

    return patterns.some(function(pattern) {
        return pattern.test(text);
    });
}

function insertHtmlAtCursor(html) {
    const selection = window.getSelection();

    if (!selection || selection.rangeCount === 0) {
        return;
    }

    const range = selection.getRangeAt(0);

    range.deleteContents();

    const fragment = range.createContextualFragment(html);
    const lastNode = fragment.lastChild;

    range.insertNode(fragment);

    // 將游標移到插入內容的最後面
    if (lastNode) {
        range.setStartAfter(lastNode);
        range.collapse(true);

        selection.removeAllRanges();
        selection.addRange(range);
    }
}

function makeImageResizable(img) {
    // data-* 會被 innerHTML 保存，但事件監聽器不會。
    // 改用不會被序列化的 DOM 暫存屬性。
    // Base64 圖片重新載入後，就能再次綁定縮放事件。
    if (img._resizeEventsBound) return;

    img._resizeEventsBound = true;

    // 清除舊版本可能留下的標記
    img.removeAttribute('data-resizable');

    // 讓舊圖片與新圖片都維持等比例縮放
    img.style.height = 'auto';

    img.addEventListener('click', function(e) {
        e.stopPropagation();
        selectResizableImage(img);
    });

    img.addEventListener('load', function() {
        if (selectedResizeImage === img) {
            positionImageResizeHandle();
        }
    });
}

function selectResizableImage(img) {
    document.querySelectorAll('.editor-content img').forEach(i => i.classList.remove('resizable'));

    selectedResizeImage = img;
    img.classList.add('resizable');

    positionImageResizeHandle();

    const handle = getImageResizeHandle();
    const label = getImageResizeSizeLabel();

    handle.style.display = 'block';
    label.style.display = 'block';
}

function clearResizableImageSelection() {
    selectedResizeImage = null;

    document.querySelectorAll('.editor-content img').forEach(i => i.classList.remove('resizable'));

    const handle = document.getElementById('image-resize-handle');
    const label = document.getElementById('image-resize-size-label');

    if (handle) handle.style.display = 'none';
    if (label) label.style.display = 'none';
}

function positionImageResizeHandle() {
    if (!selectedResizeImage) return;

    const handle = getImageResizeHandle();
    const label = getImageResizeSizeLabel();
    const rect = selectedResizeImage.getBoundingClientRect();

    if (rect.width === 0 || rect.height === 0) {
        handle.style.display = 'none';
        label.style.display = 'none';
        return;
    }

    const scrollX = window.scrollX || window.pageXOffset;
    const scrollY = window.scrollY || window.pageYOffset;

    handle.style.left = `${rect.right + scrollX - 8}px`;
    handle.style.top = `${rect.bottom + scrollY - 8}px`;

    label.textContent = `${Math.round(rect.width)} px`;
    label.style.left = `${rect.right + scrollX - 72}px`;
    label.style.top = `${rect.bottom + scrollY + 10}px`;
}

function startImageResize(e) {
    if (!selectedResizeImage) return;

    e.preventDefault();
    e.stopPropagation();

    const rect = selectedResizeImage.getBoundingClientRect();

    imageResizeState = {
        img: selectedResizeImage,
        startX: e.clientX,
        startWidth: rect.width
    };

    document.addEventListener('mousemove', resizeSelectedImage);
    document.addEventListener('mouseup', stopImageResize);
}

function resizeSelectedImage(e) {
    if (!imageResizeState) return;

    const dx = e.clientX - imageResizeState.startX;
    const editorMaxWidth = els.content.clientWidth || IMAGE_MAX_WIDTH;

    let newWidth = imageResizeState.startWidth + dx;
    newWidth = Math.max(IMAGE_MIN_WIDTH, newWidth);
    newWidth = Math.min(editorMaxWidth, IMAGE_MAX_WIDTH, newWidth);

    imageResizeState.img.style.width = `${Math.round(newWidth)}px`;
    imageResizeState.img.style.height = 'auto';

    // 避免瀏覽器自動塞 width/height attribute 造成比例或儲存異常
    imageResizeState.img.removeAttribute('width');
    imageResizeState.img.removeAttribute('height');

    positionImageResizeHandle();
}

function stopImageResize() {
    imageResizeState = null;

    document.removeEventListener('mousemove', resizeSelectedImage);
    document.removeEventListener('mouseup', stopImageResize);

    positionImageResizeHandle();
}

document.addEventListener('click', function(event) {
    const clickedImage =
        event.target.closest(
            '.editor-content img'
        );

    const clickedHandle =
        event.target.closest(
            '#image-resize-handle'
        );

    if (!clickedImage && !clickedHandle) {
        clearResizableImageSelection();
    }

    // 點擊編輯器與自動完成選單以外區域時關閉選單
    const clickedEditor =
        event.target.closest(
            '#editor-content'
        );

    const clickedAutocomplete =
        event.target.closest(
            '#card-link-autocomplete'
        );

    if (
        !clickedEditor &&
        !clickedAutocomplete
    ) {
        closeCardLinkAutocomplete();
    }
});

window.addEventListener(
    'resize',
    function() {
        positionImageResizeHandle();
        repositionCardHoverPreview();
    }
);

document.addEventListener(
    'scroll',
    function() {
        positionImageResizeHandle();

        /*
         * 捲動時直接關閉較穩定，
         * 避免預覽遮住其他卡片。
         */
        hideCardHoverPreview();
    },
    true
);

    function saveNotes() {
      if (notes.length === 0) return showToast('目前沒有任何筆記', 'error');
      const blob = new Blob([JSON.stringify(notes, null, 2)], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `zettelkasten_backup_${new Date().toISOString().split('T')[0]}.json`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(a.href); showToast('已下載', 'success');
    }

    function importNotes() {
        const file = document.getElementById('import-notes').files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = async function(e) {
            try {
                const imported = JSON.parse(e.target.result);
                if (!Array.isArray(imported)) throw new Error("Format");
                const existingIds = new Set(notes.map(n => n.id));
                let count = 0;
                imported.forEach(n => { if(!n.id) n.id = genId(); if(!existingIds.has(n.id)) { notes.push(n); existingIds.add(n.id); count++; } });
                
                // 確保雲端同步完成
                await saveToStorage(); 
                
                renderNoteList(); updateTagHistory(); renderLinkSuggestions(); updateTagTree();
                showToast(`成功導入並上傳 ${count} 則筆記`, 'success');
            } catch (err) { 
                console.error(err);
                showToast('導入或雲端上傳失敗（檔案可能過大）', 'error'); 
            }
            document.getElementById('import-notes').value = '';
        };
        reader.readAsText(file);
    }

    // --- Tag Explorer & Filters Core ---
    function buildTagTree(notesList) {
        const tree = {};
        notesList.forEach(note => {
            const processedPaths = new Set();
            (note.tags || []).forEach(tag => {
                const parts = tag.split('/'); if (parts.length < 2) return;
                const type = parts[0]; const valuePath = parts.slice(1);
                let currentPath = type; processedPaths.add(currentPath);
                valuePath.forEach(val => { currentPath += '/' + val; processedPaths.add(currentPath); });
            });
            processedPaths.forEach(path => {
                const parts = path.split('/'); const type = parts[0]; const values = parts.slice(1);
                if (!tree[type]) tree[type] = { count: 0, children: {} };
                if (values.length === 0) tree[type].count++;
                else {
                    let currentLevel = tree[type].children;
                    values.forEach((val, idx) => {
                        if (!currentLevel[val]) currentLevel[val] = { count: 0, children: {} };
                        if (idx === values.length - 1) currentLevel[val].count++;
                        currentLevel = currentLevel[val].children;
                    });
                }
            });
        });
        return tree;
    }

    function updateTagTree() {
        const searchText = els.tagTreeSearch.value.trim().toLowerCase();
        const tree = buildTagTree(notes);
        els.tagExplorer.innerHTML = '';
        const hasMatch = renderTagExplorer(tree, els.tagExplorer, [], searchText);
        if (!hasMatch && searchText) els.tagExplorer.innerHTML = '<div class="text-xs text-slate-500 text-center py-2">無符合標籤</div>';
        renderActiveFiltersPanel(); // 更新 Filter 面板
    }

    function renderTagExplorer(tree, parentEl, pathParts = [], filterText = "") {
        const keys = Object.keys(tree).sort(); let hasAnyMatch = false;
        keys.forEach(key => {
            const node = tree[key]; const currentParts = [...pathParts, key]; const currentPath = currentParts.join('/'); const depth = pathParts.length;
            const matchesFilter = key.toLowerCase().includes(filterText);
            const hasChildren = node.children && Object.keys(node.children).length > 0;

            const childContainer = document.createElement('div'); let childMatches = false;
            if (hasChildren) childMatches = renderTagExplorer(node.children, childContainer, currentParts, filterText);
            if (filterText && !matchesFilter && !childMatches) return;
            hasAnyMatch = true;

            const itemDiv = document.createElement('div'); itemDiv.className = "flex flex-col select-none";
            const headerDiv = document.createElement('div');
            
            let isActive = false;
            if (depth > 0) {
                const type = currentParts[0]; const value = currentParts.slice(1).join('/');
                isActive = activeFilters[type] && activeFilters[type].includes(value);
            }

            headerDiv.className = `flex items-center justify-between py-1 px-1.5 hover:bg-slate-700/40 rounded cursor-pointer group transition-all duration-150 ${isActive ? 'bg-tech-secondary/30 border-l-2 border-tech-accent pl-1' : ''}`;
            const leftDiv = document.createElement('div');
            leftDiv.className = "flex items-center gap-1 overflow-hidden"; leftDiv.style.paddingLeft = (depth * 10) + "px";

            if (hasChildren) {
                const isOpen = filterText !== "" || expandedTagPaths.has(currentPath) || (depth === 0 && expandedTagPaths.has("init_done"));
                if (isOpen && !expandedTagPaths.has(currentPath)) expandedTagPaths.add(currentPath);

                const toggleIcon = document.createElement('i');
                toggleIcon.className = `fa-solid fa-chevron-${isOpen ? 'down' : 'right'} text-[9px] w-3 text-center cursor-pointer transition text-slate-500 hover:text-tech-accent`;
                toggleIcon.onclick = (e) => {
                    e.stopPropagation();
                    if (expandedTagPaths.has(currentPath)) expandedTagPaths.delete(currentPath); else expandedTagPaths.add(currentPath);
                    updateTagTree();
                };
                leftDiv.appendChild(toggleIcon);
                if (!isOpen) childContainer.classList.add('hidden');
            } else { leftDiv.innerHTML += '<span class="w-3 shrink-0"></span>'; }

            const tagText = document.createElement('span');
            tagText.className = `truncate transition text-xs ${isActive ? 'text-tech-accent font-bold' : 'text-slate-300 group-hover:text-white'}`;
            tagText.textContent = key; leftDiv.appendChild(tagText);

            const countSpan = document.createElement('span');
            countSpan.className = `text-[9px] px-1 rounded shrink-0 transition ${isActive ? 'bg-tech-accent text-slate-900 font-bold' : 'bg-slate-800 text-slate-500 group-hover:bg-slate-700 group-hover:text-slate-300'}`;
            countSpan.textContent = node.count;

            headerDiv.appendChild(leftDiv); headerDiv.appendChild(countSpan);
            headerDiv.onclick = () => {
                if (depth === 0) { const toggleIcon = headerDiv.querySelector('i'); if (toggleIcon) toggleIcon.click(); } 
                else { const type = currentParts[0]; const value = currentParts.slice(1).join('/'); toggleFacetedFilter(type, value); }
            };

            itemDiv.appendChild(headerDiv); if (hasChildren) itemDiv.appendChild(childContainer);
            parentEl.appendChild(itemDiv);
        });
        return hasAnyMatch;
    }

    function toggleFacetedFilter(type, value) {
        if (!activeFilters[type]) activeFilters[type] = [];
        const idx = activeFilters[type].indexOf(value);
        if (idx > -1) activeFilters[type].splice(idx, 1);
        else activeFilters[type].push(value);
        renderNoteList(); updateTagTree();
    }

    function renderActiveFiltersPanel() {
        els.filtersList.innerHTML = ''; let hasFilters = false;
        Object.keys(activeFilters).forEach(type => {
            activeFilters[type].forEach(value => {
                hasFilters = true;
                const badge = document.createElement('span');
                badge.className = "inline-flex items-center gap-1 bg-tech-secondary/20 border border-tech-secondary/50 text-slate-200 text-xs px-2 py-1 rounded font-mono animate-fade-in";
                badge.innerHTML = `<span class="text-tech-accent font-bold">${type}:</span><span>${value}</span><button class="hover:text-red-400 font-bold ml-1 transition" onclick="removeSingleFilter('${type}', '${value}')">✕</button>`;
                els.filtersList.appendChild(badge);
            });
        });
        
        if (hasFilters) els.noFiltersMsg.classList.add('hidden');
        else els.noFiltersMsg.classList.remove('hidden');
    }

    function removeSingleFilter(type, value) { if (activeFilters[type]) activeFilters[type] = activeFilters[type].filter(v => v !== value); renderNoteList(); updateTagTree(); }
    function clearAllFilters() { activeFilters = {}; renderNoteList(); updateTagTree(); }

  </script>
</body>
