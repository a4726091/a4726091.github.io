<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZETTL // 卡片盒核心系統 + Gemini AI</title>
  
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: JetBrains Mono (Code/Tech feel) & Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  
  <!-- FontAwesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            tech: {
              bg: '#0f172a',      // Dark slate background
              panel: '#1e293b',   // Lighter panel
              border: '#334155',  // Border color
              accent: '#06b6d4',  // Cyan neon
              secondary: '#6366f1', // Indigo
              success: '#10b981', // Emerald
              danger: '#ef4444',  // Red
              warning: '#f59e0b', // Amber
            }
          },
          boxShadow: {
            'neon': '0 0 5px theme("colors.tech.accent"), 0 0 10px theme("colors.tech.accent")',
            'neon-red': '0 0 5px theme("colors.tech.danger"), 0 0 10px theme("colors.tech.danger")',
            'neon-green': '0 0 5px theme("colors.tech.success"), 0 0 10px theme("colors.tech.success")',
            'neon-purple': '0 0 5px theme("colors.tech.secondary"), 0 0 10px theme("colors.tech.secondary")',
          },
          animation: {
            'spin-slow': 'spin 3s linear infinite',
            'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          }
        }
      }
    }
  </script>

  <style>
    /* Custom Scrollbar for Webkit */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }

    /* Content Editable Placeholder */
    [contenteditable]:empty:before { content: attr(placeholder); color: #64748b; cursor: text; }

    /* Editor Specific Styles */
.editor-content img {
  max-width: 100%;
  height: auto;
  border-radius: 4px;
  border: 1px solid #334155;
  margin: 10px 0;
  transition: box-shadow 0.2s, outline 0.2s;
  cursor: pointer;
}

.editor-content img.resizable {
  outline: 2px solid #06b6d4;
  outline-offset: 2px;
  box-shadow: 0 0 0 2px rgba(6, 182, 212, 0.35), 0 0 12px rgba(6, 182, 212, 0.5);
}

#image-resize-handle {
  position: absolute;
  width: 16px;
  height: 16px;
  background: #06b6d4;
  border: 2px solid #0f172a;
  border-radius: 4px;
  box-shadow: 0 0 8px rgba(6, 182, 212, 0.9);
  cursor: nwse-resize;
  z-index: 90;
  display: none;
}

#image-resize-size-label {
  position: absolute;
  display: none;
  z-index: 91;
  padding: 2px 6px;
  border-radius: 4px;
  background: rgba(15, 23, 42, 0.95);
  border: 1px solid #06b6d4;
  color: #67e8f9;
  font-size: 11px;
  font-family: 'JetBrains Mono', monospace;
  pointer-events: none;
}
    
    .editor-content table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 15px; border: 1px solid #334155; }
    .editor-content th { background-color: #1e293b; color: #06b6d4; font-weight: 600; padding: 8px 12px; border: 1px solid #334155; text-align: left; }
    .editor-content td { padding: 8px 12px; border: 1px solid #334155; color: #cbd5e1; }
    .editor-content tr:nth-child(even) { background-color: rgba(255, 255, 255, 0.02); }
    
    /* Animation classes */
    .fade-in { animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Glassmorphism utility */
    .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }

    /* Transition utilities */
    .panel-transition { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); overflow: hidden; }
    .panel-closed-width { width: 0 !important; padding-left: 0 !important; padding-right: 0 !important; border: none !important; opacity: 0; }
    .panel-closed-height { height: 0 !important; padding-top: 0 !important; padding-bottom: 0 !important; border: none !important; opacity: 0; }

    /* Drawer specific transition */
    .drawer-open { transform: translateX(0); }
    .drawer-closed { transform: translateX(100%); }

    /* AI Loading State */
    .ai-loading { position: relative; overflow: hidden; }
    .ai-loading::after { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(6, 182, 212, 0.2), transparent); transform: translateX(-100%); animation: shimmer 1.5s infinite; }
    @keyframes shimmer { 100% { transform: translateX(100%); } }
    /* ===== Markdown 貼上格式 ===== */

.editor-content h1,
.editor-content h2,
.editor-content h3,
.editor-content h4,
.editor-content h5,
.editor-content h6 {
    margin: 12px 0 6px;
    line-height: 1.4;
}

.editor-content h1 {
    font-size: 28px;
    border-bottom: 2px solid #d0d7de;
    padding-bottom: 5px;
}

.editor-content h2 {
    font-size: 24px;
    border-bottom: 1px solid #d0d7de;
    padding-bottom: 4px;
}

.editor-content h3 {
    font-size: 20px;
}

.editor-content blockquote {
    margin: 10px 0;
    padding: 8px 12px;
    border-left: 4px solid #9ca3af;
    background-color: #f3f4f6;
    color: #4b5563;
}

.editor-content pre {
    margin: 10px 0;
    padding: 12px;
    overflow-x: auto;
    border-radius: 6px;
    background-color: #1f2937;
    color: #f9fafb;
    white-space: pre-wrap;
}

.editor-content code {
    padding: 2px 5px;
    border-radius: 4px;
    background-color: #e5e7eb;
    color: #be123c;
    font-family: Consolas, "Courier New", monospace;
}

.editor-content pre code {
    padding: 0;
    background-color: transparent;
    color: inherit;
}

.editor-content ul,
.editor-content ol {
    margin: 8px 0;
    padding-left: 30px;
}

.editor-content a {
    color: #2563eb;
    text-decoration: underline;
}

.editor-content hr {
    margin: 15px 0;
    border: 0;
    border-top: 1px solid #d1d5db;
}
/* ===== [[ 卡片連結自動完成 ===== */

#card-link-autocomplete {
    min-width: 280px;
    max-width: min(420px, calc(100vw - 24px));
}

.card-link-autocomplete-item {
    display: flex;
    align-items: center;
    gap: 9px;
    width: 100%;
    padding: 9px 12px;
    color: #cbd5e1;
    background: transparent;
    border: 0;
    text-align: left;
    cursor: pointer;
}

.card-link-autocomplete-item:hover,
.card-link-autocomplete-item.active {
    color: #ffffff;
    background: rgba(6, 182, 212, 0.18);
}

.card-link-autocomplete-number {
    min-width: 20px;
    color: #64748b;
    font-size: 11px;
    font-family: "JetBrains Mono", monospace;
}

.card-link-autocomplete-item.active
.card-link-autocomplete-number {
    color: #67e8f9;
}

.card-link-autocomplete-title {
    flex: 1;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.card-link-autocomplete-id {
    color: #64748b;
    font-size: 10px;
    font-family: "JetBrains Mono", monospace;
}

/* 插入內文後的卡片連結 */
.editor-content .internal-card-link {
    display: inline-block;
    padding: 1px 6px;
    border: 1px solid rgba(6, 182, 212, 0.45);
    border-radius: 4px;
    color: #67e8f9;
    background: rgba(6, 182, 212, 0.12);
    text-decoration: none;
    cursor: pointer;
    vertical-align: baseline;
}

.editor-content .internal-card-link:hover {
    color: #ffffff;
    background: rgba(6, 182, 212, 0.28);
    border-color: #06b6d4;
}

.editor-content .internal-card-link-broken {
    color: #fb7185;
    background: rgba(239, 68, 68, 0.12);
    border-color: rgba(239, 68, 68, 0.55);
    text-decoration: line-through;
}
/* ===== 卡片滑鼠懸停預覽 ===== */

#card-hover-preview {
    opacity: 0;
    transform: translateY(4px);
    transition:
        opacity 0.15s ease,
        transform 0.15s ease;
}

#card-hover-preview.card-hover-preview-visible {
    opacity: 1;
    transform: translateY(0);
}

#card-hover-preview-title {
    overflow-wrap: anywhere;
}

#card-hover-preview-summary {
    display: -webkit-box;
    overflow: hidden;
    /* 標準屬性，提供未來與其他瀏覽器相容性 */
    line-clamp: 6;

    /* Chromium、Edge、Safari 目前主要使用此前綴版本 */
    -webkit-line-clamp: 6;
    -webkit-box-orient: vertical;
}

.card-hover-preview-tag {
    display: inline-flex;
    align-items: center;
    max-width: 100%;
    padding: 2px 7px;
    border: 1px solid rgba(6, 182, 212, 0.35);
    border-radius: 9999px;
    color: #67e8f9;
    background: rgba(6, 182, 212, 0.1);
    font-size: 10px;
    line-height: 1.4;
}

.card-hover-preview-tag span {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

  </style>
</head>
<body class="bg-tech-bg text-slate-200 font-sans h-screen overflow-hidden flex flex-col md:flex-row landscape:flex-row relative">

  <!-- 🔲 Notification Toast Area -->
  <div id="toast-container" class="fixed top-5 right-5 z-[100] flex flex-col gap-2 pointer-events-none"></div>

  <!-- 卡片滑鼠懸停預覽 -->
<div
    id="card-hover-preview"
    class="hidden fixed z-[300] w-[360px] max-w-[calc(100vw-24px)] bg-slate-900 border border-tech-accent/60 rounded-xl shadow-2xl overflow-hidden pointer-events-none"
    role="tooltip"
>
    <div id="card-hover-preview-image-wrap" class="hidden">
        <img
            id="card-hover-preview-image"
            alt=""
            class="w-full h-36 object-cover border-b border-slate-700"
        >
    </div>

    <div class="p-4">
        <div
            id="card-hover-preview-title"
            class="text-base font-bold text-white font-mono leading-snug"
        ></div>

        <div class="mt-2 flex flex-wrap items-center gap-x-3 gap-y-1 text-[11px] text-slate-400">
            <span>
                <i class="fa-regular fa-clock mr-1 text-tech-accent"></i>
                <span id="card-hover-preview-date"></span>
            </span>

            <span>
                <i class="fa-solid fa-arrow-up-right-from-square mr-1 text-tech-secondary"></i>
                連出
                <span id="card-hover-preview-outgoing">0</span>
            </span>

            <span>
                <i class="fa-solid fa-arrow-turn-down mr-1 text-tech-success"></i>
                連入
                <span id="card-hover-preview-incoming">0</span>
            </span>
        </div>

        <div
            id="card-hover-preview-tags"
            class="mt-3 flex flex-wrap gap-1.5"
        ></div>

        <div
            id="card-hover-preview-summary"
            class="mt-3 text-sm text-slate-300 leading-relaxed"
        ></div>
    </div>
</div>

  <!-- 🔲 Shared Overlay Backdrop for Floating Panels -->
  <div id="ui-overlay" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-40 hidden transition-opacity duration-300 opacity-0" onclick="closeAllPanels()"></div>

  <!-- 🔲 Side Drawer (Right Slide-in) for Tag Explorer & Faceted Filter -->
  <div id="side-drawer" class="fixed top-0 right-0 w-80 md:w-96 h-full bg-tech-panel border-l border-tech-border z-50 drawer-closed transition-transform duration-300 ease-in-out shadow-2xl flex flex-col">
      <div class="h-16 flex items-center justify-between px-4 border-b border-tech-border bg-slate-900/50 shrink-0">
          <h2 id="drawer-title" class="font-mono font-bold text-tech-accent tracking-wider"></h2>
          <button onclick="closeAllPanels()" class="text-slate-400 hover:text-white transition p-2 rounded"><i class="fa-solid fa-times"></i></button>
      </div>
      
      <!-- Content Area -->
      <div class="flex-1 overflow-y-auto p-4 custom-scrollbar">
          
          <!-- View 1: Tag Explorer -->
          <div id="drawer-view-tag" class="hidden flex-col h-full">
              <input type="text" id="tag-tree-search" placeholder="模糊搜尋標籤..." class="w-full bg-slate-800 border border-slate-700 rounded text-sm px-3 py-2 mb-4 focus:outline-none focus:border-tech-secondary text-slate-200 transition">
              <div id="tag-explorer" class="flex-1 overflow-y-auto text-sm space-y-1"></div>
          </div>
          
          <!-- View 2: Faceted Filter Active Conditions -->
          <div id="drawer-view-filter" class="hidden flex-col h-full">
              <div id="active-filters-container" class="flex flex-col gap-4">
                  <div class="flex items-center justify-between">
                      <span class="text-sm font-mono text-slate-400 uppercase tracking-wider">目前多維度篩選</span>
                      <button onclick="clearAllFilters()" class="text-sm text-red-400 hover:underline"><i class="fa-solid fa-trash-can mr-1"></i>清除全部</button>
                  </div>
                  <div id="active-filters-list" class="flex flex-wrap gap-2"></div>
                  <div id="no-filters-msg" class="text-sm text-slate-500 py-6 text-center hidden">尚未設定任何篩選條件。<br>請至「標籤樹」點擊標籤以加入篩選。</div>
              </div>
          </div>

      </div>
  </div>

  <!-- 🔲 Center Modal for AI Tools -->
  <div id="center-modal" class="fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-11/12 max-w-md bg-tech-panel border border-tech-accent/50 rounded-xl z-50 hidden shadow-neon flex-col overflow-hidden">
      <div class="px-4 py-3 border-b border-tech-border bg-slate-900/50 flex justify-between items-center">
          <h3 class="font-mono text-white tracking-wider flex items-center">
              <i class="fa-solid fa-sparkles text-yellow-400 mr-2 animate-pulse"></i> Gemini AI 運算核心
          </h3>
          <button onclick="closeAllPanels()" class="text-slate-400 hover:text-white transition p-1"><i class="fa-solid fa-times"></i></button>
      </div>
      <div class="p-4 space-y-4 max-h-[80vh] overflow-y-auto custom-scrollbar">
        <!-- ⚙️ 自訂 API 設定欄位 -->
          <div class="p-3 bg-slate-900/80 rounded-lg border border-slate-700/50 space-y-2">
            <div class="text-xs font-mono text-tech-accent uppercase flex items-center justify-between">
              <span>⚙️ 自訂 AI API 設定</span>
              <div class="flex gap-1.5">
                <button onclick="testApiConnection()" id="btn-test-api" class="text-[10px] bg-slate-700 hover:bg-yellow-400 hover:text-slate-900 text-slate-200 px-2 py-0.5 rounded transition">
                  <i class="fa-solid fa-plug-circle-bolt mr-1"></i>測試連線
                </button>
                <button onclick="saveApiSettings()" class="text-[10px] bg-tech-accent/20 hover:bg-tech-accent hover:text-slate-900 text-tech-accent px-2 py-0.5 rounded transition">
                  儲存設定
                </button>
              </div>
            </div>
            <div>
              <label class="block text-[11px] text-slate-400 mb-0.5">模型名稱 (Model)</label>
              <input type="text" id="ai-model" placeholder="gemini-2.5-flash-preview-09-2025" class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs text-slate-200 outline-none focus:border-tech-accent">
            </div>
            <div>
              <label class="block text-[11px] text-slate-400 mb-0.5">接口地址 (Base URL)</label>
              <input type="text" id="ai-base-url" placeholder="https://generativelanguage.googleapis.com" class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs text-slate-200 outline-none focus:border-tech-accent">
            </div>
            <div>
              <label class="block text-[11px] text-slate-400 mb-0.5">模型 API Key</label>
              <input type="password" id="ai-api-key" placeholder="貼上 API Key..." class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs text-slate-200 outline-none focus:border-tech-accent">
            </div>
            <!-- 測試結果顯示區域 -->
            <div id="api-test-status" class="text-[11px] font-mono hidden py-1 px-2 rounded border"></div>
          </div>
          <!-- 智慧網頁剪藏 -->
          <div class="p-3 bg-slate-900/80 rounded-lg border border-slate-700/50">
            <label class="block text-xs font-mono text-slate-400 mb-2 uppercase">🌐 智慧網頁剪藏</label>
            <div class="flex gap-2">
              <input type="text" id="clipper-url" placeholder="輸入網址進行剪藏..." class="flex-1 bg-slate-800 border border-slate-700 rounded px-3 py-1.5 text-sm focus:border-tech-accent outline-none text-slate-200">
              <button onclick="aiClipper()" id="btn-ai-clipper" class="bg-tech-accent/20 border border-tech-accent/50 text-tech-accent hover:bg-tech-accent hover:text-slate-900 px-3 rounded transition shrink-0" title="開始剪藏">
                <i class="fa-solid fa-cloud-download"></i>
              </button>
            </div>
          </div>

          <!-- 功能按鈕 -->
          <div class="grid grid-cols-1 gap-2">
            <button onclick="aiAutoTag()" id="btn-ai-tag" class="text-left px-4 py-3 bg-slate-900 border border-slate-700 rounded-lg hover:border-yellow-400 hover:text-yellow-400 transition text-sm flex items-center group">
              <i class="fa-solid fa-tags w-6 text-slate-500 group-hover:text-yellow-400"></i>
              <span>✨ 智能標記 (依當前內容自動打標)</span>
            </button>
            <button onclick="aiSummarize()" id="btn-ai-summary" class="text-left px-4 py-3 bg-slate-900 border border-slate-700 rounded-lg hover:border-yellow-400 hover:text-yellow-400 transition text-sm flex items-center group">
              <i class="fa-solid fa-file-lines w-6 text-slate-500 group-hover:text-yellow-400"></i>
              <span>✨ 重點摘要 (產生內容短摘要)</span>
            </button>
            <button onclick="aiAutoLink()" id="btn-ai-link" class="text-left px-4 py-3 bg-slate-900 border border-slate-700 rounded-lg hover:border-yellow-400 hover:text-yellow-400 transition text-sm flex items-center group">
              <i class="fa-solid fa-project-diagram w-6 text-slate-500 group-hover:text-yellow-400"></i>
              <span>✨ 智能關聯 (自動搜尋系統網格)</span>
            </button>
          </div>
      </div>
  </div>


  <!-- 🟦 SIDEBAR (Navigation & List) 精簡版 -->
  <aside id="sidebar-left" class="panel-transition w-full md:w-80 landscape:w-80 flex flex-col border-r border-tech-border bg-tech-panel h-[40vh] md:h-full landscape:h-full shrink-0">
    <div class="p-4 border-b border-tech-border flex items-center justify-between shrink-0">
      <div class="flex items-center gap-2 text-tech-accent animate-pulse">
        <i class="fa-solid fa-microchip text-xl"></i>
        <h1 class="font-mono text-lg font-bold tracking-wider">ZETTEL_AI</h1>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="createNewNote()" title="新增資料卡" class="text-tech-accent hover:text-white transition"><i class="fa-solid fa-square-plus text-lg"></i></button>
        <button onclick="saveNotes()" title="匯出/保存 (JSON)" class="text-slate-400 hover:text-tech-accent transition"><i class="fa-solid fa-floppy-disk"></i></button>
        <label for="import-notes" title="導入 (JSON)" class="text-slate-400 hover:text-tech-accent transition cursor-pointer mb-0 flex items-center"><i class="fa-solid fa-file-import"></i></label>
        <input type="file" id="import-notes" accept=".json" class="hidden" onchange="importNotes()" />
      </div>
    </div>

    <!-- Search Input Only -->
    <div class="p-3 border-b border-tech-border bg-slate-800/50 shrink-0">
      <div class="relative">
        <i class="fa-solid fa-search absolute left-3 top-3 text-slate-500 text-xs"></i>
        <input type="text" id="search-input" placeholder="搜尋標題或內容..." class="w-full bg-slate-900 border border-slate-700 rounded text-sm px-8 py-2 focus:outline-none focus:border-tech-accent focus:shadow-neon transition text-slate-200 placeholder-slate-600">
      </div>
    </div>

    <!-- Note List -->
    <div id="note-list" class="flex-1 overflow-y-auto p-2 space-y-2 custom-scrollbar"></div>
  </aside>

  <!-- 🟩 MAIN AREA (Editor) -->
  <main class="flex-1 flex flex-col h-[60vh] md:h-full landscape:h-full relative bg-tech-bg bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAiIGhlaWdodD0iMjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGNpcmNsZSBjeD0iMSIgY3k9IjEiIHI9IjEiIGZpbGw9InJnYmEoMjU1LDI1NSwyNTUsMC4wNSkiLz48L3N2Zz4=')]">
    
    <!-- Editor Header / Toolbar (加入浮動面板觸發器) -->
    <header class="h-16 border-b border-tech-border glass-panel flex items-center justify-between px-4 md:px-6 shrink-0 z-10">
      <div class="flex items-center gap-4 w-full overflow-hidden">
        <button onclick="togglePanel('left')" class="text-slate-400 hover:text-white transition p-2 rounded hover:bg-slate-700/50 shrink-0" title="切換導航欄">
            <i class="fa-solid fa-bars"></i>
        </button>

        <input type="text" id="note-title" placeholder="輸入資料卡標題..." class="bg-transparent border-none text-lg md:text-2xl font-bold text-white placeholder-slate-600 focus:outline-none w-full font-mono tracking-wide min-w-0" />
      </div>
      
      <div class="flex items-center gap-1 md:gap-2 shrink-0 ml-2">

    async function loadFromStorage() {
        try {
            const response = await fetch(SCRIPT_URL, { redirect: 'follow' });

            const data = await response.json();
            return Array.isArray(data) ? data : null;

    async function saveToStorage() {
        try {
            // 設定單一儲存格安全字元上限（Google 試算表單格上限約 50,000 字元）
            const MAX_CELL_CHARS = 45000;
            let skippedCount = 0;

            // 確保每一張卡片內的所有獨立圖片都不超過單格上限
            const validNotes = notes.map(note => {
                const noteCopy = Object.assign({}, note);
                let images = noteCopy.images || [];

                // 檢查並篩選掉單張過大的圖片
                images = images.filter(img => {
                    if (img.length > MAX_CELL_CHARS) {
                        console.warn(`卡片《${note.title || note.id}》中有單張圖片過大 (${img.length} 字元)，已自動略過該圖片`);
                        skippedCount++;
                        return false;
                    }
                    return true;
                });

                // 檢查扣除圖片後的筆記本體 JSON 是否超限
                noteCopy.images = images;
                const bodyJsonStr = JSON.stringify(noteCopy);
                if (bodyJsonStr.length > MAX_CELL_CHARS) {
                    console.warn(`卡片《${note.title || note.id}》文字主體過大，已略過不上傳`);
                    skippedCount++;
                    return null;
                }

                return noteCopy;
            }).filter(note => note !== null);

            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(validNotes)
            });
            const result = await response.json();
            
            if (result.status !== "success") {
                throw new Error(result.message || "Unknown error");
            }

            if (skippedCount > 0) {
                showToast(`已同步，但有 ${skippedCount} 個超大圖片/內容項目未上傳`, 'info');
            }
        } catch (err) {
            console.error('儲存至 Google 試算表失敗', err);
            showToast('雲端儲存失敗', 'error');
            throw err;

      let url, headers, body;

    async function callGemini(prompt, systemInstruction = "", useSearch = false) {
        if (!aiConfig.apiKey) {
            showToast('請先填寫並儲存 AI API Key', 'error');
            throw new Error('API Key 未設定');
        }

        const baseUrl = aiConfig.baseUrl.replace(/\/$/, '');
        const model = aiConfig.model;
        let url, headers, body;

        if (isGeminiEndpoint(baseUrl)) {
            url = `${baseUrl}/v1beta/models/${model}:generateContent?key=${aiConfig.apiKey}`;
            headers = { 'Content-Type': 'application/json' };
            const payload = { contents: [{ parts: [{ text: prompt }] }], generationConfig: { maxOutputTokens: 2000, temperature: 0.4 } };
            if (systemInstruction) payload.systemInstruction = { parts: [{ text: systemInstruction }] };
            if (useSearch) payload.tools = [{ "google_search": {} }];
            body = JSON.stringify(payload);
        } else {
            url = `${baseUrl}/chat/completions`;
            headers = {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${aiConfig.apiKey}`
            };
            const messages = [];
            if (systemInstruction) messages.push({ role: "system", content: systemInstruction });
            messages.push({ role: "user", content: prompt });
            body = JSON.stringify({
                model: model,
                messages: messages,
                max_tokens: 2000,
                temperature: 0.4
            });
        }

        for (let i = 0; i <= 5; i++) {
            try {
                const response = await fetch(url, { method: 'POST', headers, body });
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const data = await response.json();
                
                if (isGeminiEndpoint(baseUrl)) {
                    return data.candidates?.[0]?.content?.parts?.[0]?.text || "";
                } else {
                    return data.choices?.[0]?.message?.content || "";
                }
            } catch (e) {
                 if (i === 5) throw e;
                 await new Promise(r => setTimeout(r, [1000, 2000, 4000, 8000, 16000][i]));
            }
        }
    }

        <i class="fa-solid ${type === 'success' ? 'fa-check' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle'}"></i>

        toast.style.opacity = '0';
        toast.style.transform = 'translateY(-10px)';

        setTimeout(() => toast.remove(), 300);

    function toggleFloatingPanel(panelName) {

            closeAllPanels();

        }
        
        activeFloatingPanel = panelName;

    // --- Elegant Smart Paste Handler ---
    // --- Elegant Smart Paste Handler ---
function handlePaste(e) {
    const clipboardData = e.clipboardData;

    if (!clipboardData) {
        return;
    }

    const text = clipboardData.getData('text/plain');
    const html = clipboardData.getData('text/html');

    const clipboardItems = Array.from(
        clipboardData.items || []
    );

    const containsImage = clipboardItems.some(function(item) {
        return item.type.startsWith('image/');
    });

    /*
     * 如果剪貼簿包含真正的圖片檔案，
     * 不在此攔截，交給瀏覽器或既有圖片處理機制。
     */
    if (containsImage && !text && !html) {
        return;
    }

    e.preventDefault();

    /*
     * 原始碼模式：
     * 一律使用純文字貼上，因此會保留：
     * #、##、**、```、- 等 Markdown 符號。
     */
    if (markdownPasteMode === 'source') {
        if (text) {
            document.execCommand(
                'insertText',
                false,
                text
            );

            showToast(
                '已以 Markdown 原始碼模式貼上',
                'info'
            );
        }

        return;
    }

    /*
     * 預覽模式：
     * 如果純文字內含 Markdown，就轉成 HTML 排版。
     */
    if (
        text &&
        containsMarkdownSyntax(text)
    ) {
        const markdownHtml =
            convertMarkdownToHtml(text);

        insertHtmlAtCursor(markdownHtml);

        setTimeout(function() {
            document
                .querySelectorAll('#editor-content img')
                .forEach(makeImageResizable);
        }, 100);

        els.content.dispatchEvent(
            new Event('input', {
                bubbles: true
            })
        );

        showToast(
            '已將 Markdown 轉換為預覽排版',
            'success'
        );

        return;
    }

    /*
     * 沒有 Markdown，但剪貼簿含網頁 HTML：
     * 使用原本的智慧清理功能。
     */
    if (html) {
        const cleanedHtml =
            cleanPastedHTML(html);

        document.execCommand(
            'insertHTML',
            false,
            cleanedHtml
        );

        setTimeout(function() {
            document
                .querySelectorAll('#editor-content img')
                .forEach(makeImageResizable);
        }, 100);

        showToast(
            '已智慧過濾網頁格式與廣告樣式',
            'success'
        );

        return;
    }

    /*
     * 普通純文字：
     * 不含 Markdown 時直接貼上。
     */
    if (text) {
        document.execCommand(
            'insertText',
            false,
            text
        );
    }
}

    function cleanPastedHTML(htmlString) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(htmlString, 'text/html');
        const allowedTags = ['P', 'BR', 'B', 'STRONG', 'I', 'EM', 'U', 'H1', 'H2', 'H3', 'H4', 'H5', 'H6', 'UL', 'OL', 'LI', 'BLOCKQUOTE', 'TABLE', 'THEAD', 'TBODY', 'TR', 'TH', 'TD', 'IMG', 'A'];
        
        function sanitizeNode(node) {
            if (node.nodeType === Node.TEXT_NODE) return node.cloneNode(true);
            if (node.nodeType === Node.ELEMENT_NODE) {
                const tagName = node.tagName.toUpperCase();
                if (allowedTags.includes(tagName)) {
                    const newNode = doc.createElement(tagName);
                    if (tagName === 'IMG') {
                        const src = node.getAttribute('src');
                        if (src) { newNode.setAttribute('src', src); newNode.className = 'resizable'; newNode.style.width = '200px'; newNode.style.height = 'auto'; }
                    } else if (tagName === 'A') {
    const href =
        node.getAttribute('href');

    const cardId =
        node.getAttribute('data-card-id');

    if (cardId) {
        newNode.setAttribute(
            'href',
            `#card/${encodeURIComponent(cardId)}`
        );

        newNode.setAttribute(
            'data-card-id',
            cardId
        );

        newNode.setAttribute(
            'contenteditable',
            'false'
        );

        newNode.className =
            'internal-card-link';
    } else if (
        href &&
        (
            href.startsWith('http') ||
            href.startsWith('#')
        )
    ) {
        newNode.setAttribute(
            'href',
            href
        );

        newNode.setAttribute(
            'target',
            '_blank'
        );

        newNode.setAttribute(
            'rel',
            'noopener noreferrer'
        );

        newNode.className =
            'text-tech-accent underline hover:text-white transition';
    }
}
                    node.childNodes.forEach(child => { const sanitizedChild = sanitizeNode(child); if (sanitizedChild) newNode.appendChild(sanitizedChild); });
                    return newNode;
                } else {
                    const fragment = doc.createDocumentFragment();
                    node.childNodes.forEach(child => { const sanitizedChild = sanitizeNode(child); if (sanitizedChild) fragment.appendChild(sanitizedChild); });
                    return fragment;
                }
            }
            return null;
        }
        const rootFragment = doc.createDocumentFragment();
        doc.body.childNodes.forEach(child => { const sanitized = sanitizeNode(child); if (sanitized) rootFragment.appendChild(sanitized); });
        const tempDiv = doc.createElement('div'); tempDiv.appendChild(rootFragment);
        return tempDiv.innerHTML;
    }

    // --- Gemini AI Functions ---
    async function callGemini(prompt, systemInstruction = "", useSearch = false) {
        if (!aiConfig.apiKey) {
            showToast('請先填寫並儲存 AI API Key', 'error');
            throw new Error('API Key 未設定');
        }

        const baseUrl = aiConfig.baseUrl.replace(/\/$/, '');
        const model = aiConfig.model;
        let url, headers, body;

        if (isGeminiEndpoint(baseUrl)) {
            url = `${baseUrl}/v1beta/models/${model}:generateContent?key=${aiConfig.apiKey}`;
            headers = { 'Content-Type': 'application/json' };
            const payload = { contents: [{ parts: [{ text: prompt }] }], generationConfig: { maxOutputTokens: 2000, temperature: 0.4 } };
            if (systemInstruction) payload.systemInstruction = { parts: [{ text: systemInstruction }] };
            if (useSearch) payload.tools = [{ "google_search": {} }];
            body = JSON.stringify(payload);
        } else {
            url = `${baseUrl}/chat/completions`;
            headers = {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${aiConfig.apiKey}`
            };
            const messages = [];
            if (systemInstruction) messages.push({ role: "system", content: systemInstruction });
            messages.push({ role: "user", content: prompt });
            body = JSON.stringify({
                model: model,
                messages: messages,
                max_tokens: 2000,
                temperature: 0.4
            });
        }

        for (let i = 0; i <= 5; i++) {
            try {
                const response = await fetch(url, { method: 'POST', headers, body });
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const data = await response.json();
                
                let resText = isGeminiEndpoint(baseUrl)
                    ? (data.candidates?.[0]?.content?.parts?.[0]?.text || "")
                    : (data.choices?.[0]?.message?.content || "");
                
                return resText;
            } catch (e) {
                 if (i === 5) throw e;
                 await new Promise(r => setTimeout(r, [1000, 2000, 4000, 8000, 16000][i]));
            }
        }
    }

    // --- Core Operations ---
    function genId() { return Date.now().toString(36) + Math.random().toString(36).substr(2); }

    // ===== 統一卡片連結使用 cardId =====

// 所有 cardId 一律轉成字串比較，避免數字 ID 與字串 ID 比對失敗
function normalizeCardId(cardId) {
    if (cardId === undefined || cardId === null) {
        return '';
    }

    return String(cardId);
}


// 依 cardId 尋找卡片
function findCardById(cardId) {
    const normalizedId = normalizeCardId(cardId);

    if (!normalizedId) {
        return null;
    }

    return notes.find(function(note) {
        return normalizeCardId(note.id) === normalizedId;
    }) || null;
}


// 統一使用 cardId 開啟卡片
function openCardById(cardId) {
    const note = findCardById(cardId);

    if (!note) {
        showToast(
            `找不到卡片，CardId：${cardId}`,
            'error'
        );

        return;
    }

    loadNote(note.id);
}

// 將 HTML 內容轉成預覽純文字
function getCardPreviewText(note) {
    const temp = document.createElement('div');

    let contentHtml =
        String(note?.content || '');

    /*
     * 內容中的圖片可能已抽離成 __IMG_0__。
     * 文字預覽不需要還原圖片，只需要取得純文字。
     */
    temp.innerHTML = contentHtml;

    let text =
        temp.textContent ||
        temp.innerText ||
        '';

    text = text
        .replace(/\s+/g, ' ')
        .trim();

    if (!text) {
        return '無內容摘要';
    }

    if (
        text.length >
        CARD_HOVER_PREVIEW_TEXT_LENGTH
    ) {
        return (
            text.substring(
                0,
                CARD_HOVER_PREVIEW_TEXT_LENGTH
            ).trim() +
            '……'
        );
    }

    return text;
}


// 取得第一張圖片
function getCardPreviewFirstImage(note) {
    if (!note) {
        return '';
    }

    const temp =
        document.createElement('div');

    temp.innerHTML =
        String(note.content || '');

    const firstImage =
        temp.querySelector('img');

    if (firstImage) {
        const imageSrc =
            firstImage.getAttribute('src') || '';

        /*
         * 圖片已抽離成 __IMG_0__ 時，
         * 從 note.images 陣列還原。
         */
        const placeholderMatch =
            imageSrc.match(
                /^__IMG_(\d+)__$/
            );

        if (placeholderMatch) {
            const imageIndex =
                Number(placeholderMatch[1]);

            return (
                Array.isArray(note.images)
                    ? note.images[imageIndex]
                    : ''
            ) || '';
        }

        if (
            imageSrc.startsWith('data:image') ||
            imageSrc.startsWith('http://') ||
            imageSrc.startsWith('https://') ||
            imageSrc.startsWith('blob:')
        ) {
            return imageSrc;
        }
    }

    /*
     * 部分舊卡片可能沒有在 content 中保留 img，
     * 但 images 陣列仍有圖片。
     */
    if (
        Array.isArray(note.images) &&
        note.images.length > 0
    ) {
        return note.images[0] || '';
    }

    return '';
}


// 統一格式化更新日期
function formatCardPreviewDate(note) {
    /*
     * 優先依序支援常見欄位名稱。
     * 目前資料若尚未保存 updatedAt，
     * 則顯示「尚未記錄」。
     */
    const rawDate =
        note?.updatedAt ||
        note?.updatedDate ||
        note?.modifiedAt ||
        note?.lastModified ||
        note?.createdAt ||
        '';

    if (!rawDate) {
        return '尚未記錄';
    }

    const date =
        new Date(rawDate);

    if (
        Number.isNaN(
            date.getTime()
        )
    ) {
        return String(rawDate);
    }

    return new Intl.DateTimeFormat(
        'zh-TW',
        {
            year: 'numeric',
            month: '2-digit',
            day: '2-digit'
        }
    ).format(date);
}


// 計算卡片連出數量
function getCardOutgoingLinkCount(note) {
    if (
        !note ||
        !Array.isArray(note.linkedNotes)
    ) {
        return 0;
    }

    return new Set(
        note.linkedNotes
            .map(normalizeCardId)
            .filter(function(cardId) {
                return (
                    cardId &&
                    cardId !==
                        normalizeCardId(
                            note.id
                        ) &&
                    findCardById(cardId)
                );
            })
    ).size;
}


// 計算有多少卡片連入目前卡片
function getCardIncomingLinkCount(cardId) {
    const normalizedTargetId =
        normalizeCardId(cardId);

    if (!normalizedTargetId) {
        return 0;
    }

    return notes.filter(function(note) {
        if (
            !Array.isArray(
                note.linkedNotes
            )
        ) {
            return false;
        }

        return note.linkedNotes.some(
            function(linkedCardId) {
                return (
                    normalizeCardId(
                        linkedCardId
                    ) ===
                    normalizedTargetId
                );
            }
        );
    }).length;
}


// 將預覽內容填入浮窗

// 將浮窗放在觸發元素附近
function positionCardHoverPreview(target) {
    if (!target) {
        return;
    }

    const preview =
        els.cardHoverPreview;

    const targetRect =
        target.getBoundingClientRect();

    const viewportPadding = 12;
    const gap = 10;
    const previewWidth =
        Math.min(
            360,
            window.innerWidth -
                viewportPadding * 2
        );

    preview.style.width =
        `${previewWidth}px`;

    /*
     * 先顯示但保持透明，
     * 才能取得實際高度。
     */
    preview.classList.remove('hidden');

    const previewRect =
        preview.getBoundingClientRect();

    let left =
        targetRect.right + gap;

    let top =
        targetRect.top;

    /*
     * 右側空間不足時，改放到觸發元素左邊。
     */
    if (
        left + previewWidth >
        window.innerWidth -
            viewportPadding
    ) {
        left =
            targetRect.left -
            previewWidth -
            gap;
    }

    /*
     * 左右都放不下時，
     * 對齊畫面右側安全距離。
     */
    if (left < viewportPadding) {
        left =
            Math.max(
                viewportPadding,
                window.innerWidth -
                    previewWidth -
                    viewportPadding
            );
    }

    /*
     * 避免浮窗超出畫面底部。
     */
    if (
        top + previewRect.height >
        window.innerHeight -
            viewportPadding
    ) {
        top =
            window.innerHeight -
            previewRect.height -
            viewportPadding;
    }

    if (top < viewportPadding) {
        top = viewportPadding;
    }

    preview.style.left =
        `${Math.round(left)}px`;

    preview.style.top =
        `${Math.round(top)}px`;
}


// 顯示指定 cardId 的預覽
function showCardHoverPreview(
    cardId,
    target
) {
    const note =
        findCardById(cardId);

    if (!note || !target) {
        hideCardHoverPreview();
        return;
    }

    cardHoverPreviewCardId =
        normalizeCardId(note.id);

    cardHoverPreviewTarget =
        target;

    renderCardHoverPreview(note);
    positionCardHoverPreview(target);

    requestAnimationFrame(
        function() {
            els.cardHoverPreview
                .classList.add(
                    'card-hover-preview-visible'
                );
        }
    );
}


// 排程顯示，預設延遲 400 毫秒
function scheduleCardHoverPreview(
    cardId,
    target
) {
    clearTimeout(
        cardHoverPreviewTimer
    );

    /*
     * 同一張卡片已經顯示時，
     * 只更新位置，不重新等待。
     */
    if (
        !els.cardHoverPreview
            .classList.contains('hidden') &&
        normalizeCardId(cardId) ===
            cardHoverPreviewCardId
    ) {
        cardHoverPreviewTarget =
            target;

        positionCardHoverPreview(target);
        return;
    }

    cardHoverPreviewTimer =
        setTimeout(function() {
            showCardHoverPreview(
                cardId,
                target
            );
        }, CARD_HOVER_PREVIEW_DELAY);
}


// 關閉預覽
function hideCardHoverPreview() {
    clearTimeout(
        cardHoverPreviewTimer
    );

    cardHoverPreviewTimer = null;
    cardHoverPreviewTarget = null;
    cardHoverPreviewCardId = '';

    els.cardHoverPreview
        .classList.remove(
            'card-hover-preview-visible'
        );

    setTimeout(function() {
        if (
            !els.cardHoverPreview
                .classList.contains(
                    'card-hover-preview-visible'
                )
        ) {
            els.cardHoverPreview
                .classList.add('hidden');
        }
    }, 150);
}


// 辨識三種可預覽的卡片元素
function getCardHoverTarget(element) {
    if (!(element instanceof Element)) {
        return null;
    }

    return element.closest(
        [
            '.note-item[data-card-id]',
            '.internal-card-link[data-card-id]',
            '.link-card[data-card-id]'
        ].join(',')
    );
}


// 使用事件代理處理滑鼠移入
function handleCardHoverMouseOver(event) {
    const target =
        getCardHoverTarget(
            event.target
        );

    if (!target) {
        return;
    }

    /*
     * mouseover 會在子元素之間重複觸發。
     * relatedTarget 仍位於同一張卡片內時不處理。
     */
    if (
        event.relatedTarget &&
        target.contains(
            event.relatedTarget
        )
    ) {
        return;
    }

    const cardId =
        target.dataset.cardId;

    if (!cardId) {
        return;
    }

    scheduleCardHoverPreview(
        cardId,
        target
    );
}


// 使用事件代理處理滑鼠移出
function handleCardHoverMouseOut(event) {
    const target =
        getCardHoverTarget(
            event.target
        );

    if (!target) {
        return;
    }

    if (
        event.relatedTarget &&
        target.contains(
            event.relatedTarget
        )
    ) {
        return;
    }

    hideCardHoverPreview();
}


// 畫面捲動或縮放時重新定位
function repositionCardHoverPreview() {
    if (
        cardHoverPreviewTarget &&
        !els.cardHoverPreview
            .classList.contains('hidden')
    ) {
        positionCardHoverPreview(
            cardHoverPreviewTarget
        );
    }
}

// ===== 卡片雙向連結共用功能 ===============
// ==========================================


// 取得目前右側「連結網絡」中的全部 cardId
function getLinkedNetworkCardIds() {
    return Array.from(
        els.linkedList.querySelectorAll(
            '.link-card[data-card-id]'
        )
    )
        .map(function(card) {
            return normalizeCardId(
                card.dataset.cardId
            );
        })
        .filter(Boolean);
}


// 取得目前內文中的全部 CardId 卡片連結
function getContentCardLinkIds() {
    /*
     * Markdown 原始碼模式中，內文不是 HTML 連結，
     * 格式為：
     * [[卡片標題|cardId]]
     */
    if (markdownPasteMode === 'source') {
        const sourceText =
            els.content.innerText || '';

        const cardIds = [];
        const pattern =
            /\[\[[^\]|]+\|([^\]]+)\]\]/g;

        let match;

        while (
            (
                match =
                    pattern.exec(sourceText)
            ) !== null
        ) {
            const cardId =
                normalizeCardId(
                    match[1].trim()
                );

            if (cardId) {
                cardIds.push(cardId);
            }
        }

        return [...new Set(cardIds)];
    }

    /*
     * Markdown 預覽模式直接讀取
     * data-card-id。
     */
    return [
        ...new Set(
            Array.from(
                els.content.querySelectorAll(
                    '.internal-card-link[data-card-id]'
                )
            )
                .map(function(link) {
                    return normalizeCardId(
                        link.dataset.cardId
                    );
                })
                .filter(Boolean)
        )
    ];
}


// 將指定卡片加入目前右側的連結網絡
function addCardToCurrentLinkNetwork(cardId) {
    const normalizedTargetId =
        normalizeCardId(cardId);

    if (!normalizedTargetId) {
        return false;
    }

    // 不允許卡片連結自己
    if (
        currentNoteId &&
        normalizedTargetId ===
            normalizeCardId(currentNoteId)
    ) {
        return false;
    }

    const targetNote =
        findCardById(normalizedTargetId);

    if (!targetNote) {
        return false;
    }

    const currentLinkedIds =
        getLinkedNetworkCardIds();

    if (
        currentLinkedIds.includes(
            normalizedTargetId
        )
    ) {
        return false;
    }

    renderLinkedUI([
        ...currentLinkedIds,
        normalizedTargetId
    ]);

    return true;
}


// 立即建立目前卡片與目標卡片的雙向連結
async function addBidirectionalCardLink(
    targetCardId,
    options = {}
) {
    const normalizedTargetId =
        normalizeCardId(targetCardId);

    if (!normalizedTargetId) {
        return false;
    }

    const targetNote =
        findCardById(normalizedTargetId);

    if (!targetNote) {
        showToast(
            `找不到卡片，CardId：${targetCardId}`,
            'error'
        );

        return false;
    }

    /*
     * 先把目標卡片加入目前畫面的連結網絡。
     * 新卡片尚未取得 currentNoteId 時也能先加入，
     * 等建立卡片時再正式建立反向連結。
     */
    const addedToCurrentNetwork =
        addCardToCurrentLinkNetwork(
            normalizedTargetId
        );

    /*
     * 目前卡片尚未儲存，沒有 cardId，
     * 暫時無法寫入目標卡片的 linkedNotes。
     */
    if (!currentNoteId) {
        return addedToCurrentNetwork;
    }

    const normalizedCurrentId =
        normalizeCardId(currentNoteId);

    if (
        normalizedCurrentId ===
        normalizedTargetId
    ) {
        return false;
    }

    if (!Array.isArray(targetNote.linkedNotes)) {
        targetNote.linkedNotes = [];
    }

    const targetAlreadyLinksCurrent =
        targetNote.linkedNotes.some(
            function(linkedCardId) {
                return (
                    normalizeCardId(
                        linkedCardId
                    ) === normalizedCurrentId
                );
            }
        );

    if (!targetAlreadyLinksCurrent) {
        targetNote.linkedNotes.push(
            normalizedCurrentId
        );
    }

    /*
     * 同步目前卡片的記憶體資料。
     * 畫面仍以 renderLinkedUI 的內容為準。
     */
    const currentNote =
        findCardById(normalizedCurrentId);

    if (currentNote) {
        if (
            !Array.isArray(
                currentNote.linkedNotes
            )
        ) {
            currentNote.linkedNotes = [];
        }

        const currentAlreadyLinksTarget =
            currentNote.linkedNotes.some(
                function(linkedCardId) {
                    return (
                        normalizeCardId(
                            linkedCardId
                        ) ===
                        normalizedTargetId
                    );
                }
            );

        if (!currentAlreadyLinksTarget) {
            currentNote.linkedNotes.push(
                normalizedTargetId
            );
        }
    }

    /*
     * [[ 插入時直接儲存反向連結。
     * 傳入 saveImmediately:false 時，
     * 交由「儲存所有變更」統一儲存。
     */
    if (
        options.saveImmediately !== false
    ) {
        try {
            await saveToStorage();
        } catch (error) {
            console.error(
                '雙向連結儲存失敗',
                error
            );
        }
    }

    return (
        addedToCurrentNetwork ||
        !targetAlreadyLinksCurrent
    );
}


// 儲存時同步所有雙向連結
function synchronizeBidirectionalLinks(
    sourceCardId,
    oldLinkedIds,
    newLinkedIds
) {
    const normalizedSourceId =
        normalizeCardId(sourceCardId);

    if (!normalizedSourceId) {
        return;
    }

    const oldSet = new Set(
        (oldLinkedIds || [])
            .map(normalizeCardId)
            .filter(Boolean)
    );

    const newSet = new Set(
        (newLinkedIds || [])
            .map(normalizeCardId)
            .filter(Boolean)
    );

    // 避免自己連結自己
    newSet.delete(normalizedSourceId);

    /*
     * 1. 移除已取消連結卡片中的反向連結。
     */
    oldSet.forEach(function(targetCardId) {
        if (newSet.has(targetCardId)) {
            return;
        }

        const targetNote =
            findCardById(targetCardId);

        if (
            !targetNote ||
            !Array.isArray(
                targetNote.linkedNotes
            )
        ) {
            return;
        }

        targetNote.linkedNotes =
            targetNote.linkedNotes.filter(
                function(linkedCardId) {
                    return (
                        normalizeCardId(
                            linkedCardId
                        ) !==
                        normalizedSourceId
                    );
                }
            );
    });

    /*
     * 2. 為新增或保留的連結建立反向連結。
     */
    newSet.forEach(function(targetCardId) {
        const targetNote =
            findCardById(targetCardId);

        if (!targetNote) {
            return;
        }

        if (
            !Array.isArray(
                targetNote.linkedNotes
            )
        ) {
            targetNote.linkedNotes = [];
        }

        const alreadyLinked =
            targetNote.linkedNotes.some(
                function(linkedCardId) {
                    return (
                        normalizeCardId(
                            linkedCardId
                        ) ===
                        normalizedSourceId
                    );
                }
            );

        if (!alreadyLinked) {
            targetNote.linkedNotes.push(
                normalizedSourceId
            );
        }
    });
}

if (markdownPasteMode === 'source') {

const networkLinkIds =

    // --- Filters & Tree Core ---
    function applyFacetedFilters(notesList, filters) {
        const filterTypes = Object.keys(filters).filter(type => filters[type].length > 0);
        if (filterTypes.length === 0) return notesList;
        return notesList.filter(note => {
            return filterTypes.every(type => {
                const allowedValues = filters[type];
                return (note.tags || []).some(tag => {
                    const parts = tag.split('/');
                    if (parts[0] !== type) return false;
                    const valuePath = parts.slice(1).join('/');
                    return allowedValues.some(val => valuePath === val || valuePath.startsWith(val + '/'));
                });
            });
        });
    }

// ===== [[ 卡片連結自動完成 ================

// 將字串轉成可安全放入 HTML 的文字
function escapeCardLinkText(value) {
    const div = document.createElement('div');
    div.textContent = String(value ?? '');
    return div.innerHTML;
}


// 取得游標前方目前正在輸入的 [[關鍵字
function getCardLinkTriggerAtCursor() {
    const selection = window.getSelection();

    if (
        !selection ||
        selection.rangeCount === 0 ||
        !selection.isCollapsed
    ) {
        return null;
    }

    const range = selection.getRangeAt(0);

    if (!els.content.contains(range.startContainer)) {
        return null;
    }

    /*
     * 建立一個從內文開頭到目前游標的 Range，
     * 再從文字尾端尋找尚未關閉的 [[。
     */
    const beforeCursorRange = document.createRange();

    beforeCursorRange.selectNodeContents(els.content);
    beforeCursorRange.setEnd(
        range.startContainer,
        range.startOffset
    );

    const beforeCursorText =
        beforeCursorRange.toString();

    /*
     * 符合：
     * [[
     * [[Excel
     *
     * 不符合已完整關閉的：
     * [[Excel]]
     */
    const match =
        beforeCursorText.match(/\[\[([^\[\]\n]*)$/);

    if (!match) {
        return null;
    }

    const triggerText = match[0];
    const query = match[1].trim();

    /*
     * 從目前游標往前移動 triggerText.length 個字元，
     * 找到 [[ 的實際起點。
     */
    const triggerRange = createRangeBeforeCursor(
        range,
        triggerText.length
    );

    if (!triggerRange) {
        return null;
    }

    return {
        query: query,
        range: triggerRange
    };
}


// 建立「游標前指定字數」的 Range
function createRangeBeforeCursor(cursorRange, characterCount) {
    const textNodes = [];

    const walker = document.createTreeWalker(
        els.content,
        NodeFilter.SHOW_TEXT
    );

    let node;

    while ((node = walker.nextNode())) {
        textNodes.push(node);
    }

    let cursorAbsoluteOffset = 0;
    let foundCursor = false;

    for (const textNode of textNodes) {
        if (textNode === cursorRange.startContainer) {
            cursorAbsoluteOffset +=
                cursorRange.startOffset;

            foundCursor = true;
            break;
        }

        cursorAbsoluteOffset +=
            textNode.textContent.length;
    }

    /*
     * 游標可能位於 div、p 等元素節點，而不是文字節點。
     * 這時使用前方 Range 的純文字長度計算。
     */
    if (!foundCursor) {
        const beforeCursorRange =
            document.createRange();

        beforeCursorRange.selectNodeContents(
            els.content
        );

        beforeCursorRange.setEnd(
            cursorRange.startContainer,
            cursorRange.startOffset
        );

        cursorAbsoluteOffset =
            beforeCursorRange.toString().length;
    }

    const startAbsoluteOffset =
        cursorAbsoluteOffset - characterCount;

    if (startAbsoluteOffset < 0) {
        return null;
    }

    let runningOffset = 0;
    let startNode = null;
    let startOffset = 0;
    let endNode = null;
    let endOffset = 0;

    for (const textNode of textNodes) {
        const nodeLength =
            textNode.textContent.length;

        if (
            !startNode &&
            startAbsoluteOffset >= runningOffset &&
            startAbsoluteOffset <=
                runningOffset + nodeLength
        ) {
            startNode = textNode;
            startOffset =
                startAbsoluteOffset -
                runningOffset;
        }

        if (
            cursorAbsoluteOffset >= runningOffset &&
            cursorAbsoluteOffset <=
                runningOffset + nodeLength
        ) {
            endNode = textNode;
            endOffset =
                cursorAbsoluteOffset -
                runningOffset;

            break;
        }

        runningOffset += nodeLength;
    }

    if (!startNode) {
        return null;
    }

    /*
     * 如果游標位於元素節點，找不到精確的 endNode，
     * 使用原本的游標位置作為 Range 終點。
     */
    const replaceRange = document.createRange();

    replaceRange.setStart(
        startNode,
        startOffset
    );

    if (endNode) {
        replaceRange.setEnd(
            endNode,
            endOffset
        );
    } else {
        replaceRange.setEnd(
            cursorRange.startContainer,
            cursorRange.startOffset
        );
    }

    return replaceRange;
}


// 搜尋符合標題的卡片
function searchCardsForAutocomplete(query) {
    const normalizedQuery =
        query.trim().toLowerCase();

    return notes
        .filter(function(note) {
            // 不顯示目前正在編輯的卡片
            if (
                normalizeCardId(note.id) ===
                normalizeCardId(currentNoteId)
            ) {
                return false;
            }

            if (!normalizedQuery) {
                return true;
            }

            return String(note.title || '')
                .toLowerCase()
                .includes(normalizedQuery);
        })
        .sort(function(a, b) {
            const titleA =
                String(a.title || '').toLowerCase();

            const titleB =
                String(b.title || '').toLowerCase();

            /*
             * 標題開頭符合的卡片優先顯示。
             * 例如搜尋 Excel：
             * Excel 批次列印排在「我的 Excel」之前。
             */
            const aStarts =
                titleA.startsWith(normalizedQuery);

            const bStarts =
                titleB.startsWith(normalizedQuery);

            if (aStarts !== bStarts) {
                return aStarts ? -1 : 1;
            }

            return titleA.localeCompare(
                titleB,
                'zh-Hant'
            );
        })
        .slice(0, 8);
}


// 顯示自動完成選單
function showCardLinkAutocomplete(triggerInfo) {
    const results =

    cardLinkAutocompleteState.query =

    cardLinkAutocompleteState.results =
        results;
    cardLinkAutocompleteState.selectedIndex = 0;
    cardLinkAutocompleteState.replaceRange =
        triggerInfo.range.cloneRange();

    renderCardLinkAutocomplete();
    positionCardLinkAutocomplete();
}

         */
        item.addEventListener(
            'mousedown',
            function(event) {
                event.preventDefault();

                insertCardLinkFromAutocomplete(

                );
            }
        );

        menu.appendChild(item);
    });

    menu.classList.remove('hidden');
}


// 將選單放在目前游標下方
function positionCardLinkAutocomplete() {
    const range =
        cardLinkAutocompleteState.replaceRange;

    if (!range) {
        return;
    }

    let rect = range.getBoundingClientRect();

    /*
     * 空 Range 有時不會回傳尺寸，
     * 加入暫時文字節點取得游標位置。
     */
    if (
        rect.width === 0 &&
        rect.height === 0
    ) {
        const marker =
            document.createElement('span');

        marker.textContent = '\u200b';

        const markerRange =
            range.cloneRange();

        markerRange.collapse(false);
        markerRange.insertNode(marker);

        rect = marker.getBoundingClientRect();
        marker.remove();
    }

    const menu =
        els.cardLinkAutocomplete;

    const menuWidth = 320;
    const viewportPadding = 12;

    let left = rect.left;
    let top = rect.bottom + 6;

    if (
        left + menuWidth >
        window.innerWidth - viewportPadding
    ) {
        left =
            window.innerWidth -
            menuWidth -
            viewportPadding;
    }

    if (left < viewportPadding) {
        left = viewportPadding;
    }

    /*
     * 游標靠近畫面底部時，改顯示在游標上方。
     */
    const estimatedMenuHeight =
        Math.min(
            288,
            Math.max(
                48,
                cardLinkAutocompleteState
                    .results.length * 42
            )
        );

    if (
        top + estimatedMenuHeight >
        window.innerHeight - viewportPadding
    ) {
        top =
            Math.max(
                viewportPadding,
                rect.top -
                estimatedMenuHeight -
                6
            );
    }

    menu.style.left = `${Math.round(left)}px`;
    menu.style.top = `${Math.round(top)}px`;
}


// 關閉自動完成選單
function closeCardLinkAutocomplete() {
    cardLinkAutocompleteState.open = false;
    cardLinkAutocompleteState.query = '';
    cardLinkAutocompleteState.results = [];
    cardLinkAutocompleteState.selectedIndex = 0;
    cardLinkAutocompleteState.replaceRange = null;

    els.cardLinkAutocomplete.classList.add(
        'hidden'
    );

    els.cardLinkAutocomplete.innerHTML = '';
}


// 移動選單中的目前項目
function moveCardLinkAutocomplete(direction) {
    const results =
        cardLinkAutocompleteState.results;

    if (results.length === 0) {
        return;
    }

    let newIndex =
        cardLinkAutocompleteState.selectedIndex +
        direction;

    if (newIndex < 0) {
        newIndex = results.length - 1;
    }

    if (newIndex >= results.length) {
        newIndex = 0;
    }

    cardLinkAutocompleteState.selectedIndex =
        newIndex;

    renderCardLinkAutocomplete();

    const activeItem =
        els.cardLinkAutocomplete.querySelector(
            '.card-link-autocomplete-item.active'
        );

    activeItem?.scrollIntoView({
        block: 'nearest'
    });
}


// 插入選到的卡片連結
function insertCardLinkFromAutocomplete(index) {
    const note =
        cardLinkAutocompleteState.results[index];

    const replaceRange =
        cardLinkAutocompleteState.replaceRange;

    if (!note || !replaceRange) {
        closeCardLinkAutocomplete();
        return;
    }

    const cardId =
        normalizeCardId(note.id);

    const title =
        note.title || '未命名卡片';

    replaceRange.deleteContents();

    /*
     * 原始碼模式使用自訂 Markdown 語法：
     * [[顯示標題|cardId]]
     */
    if (markdownPasteMode === 'source') {
        const sourceText =
            `[[${title}|${cardId}]]`;

        const textNode =
            document.createTextNode(sourceText);

        replaceRange.insertNode(textNode);

        replaceRange.setStartAfter(textNode);
        replaceRange.collapse(true);
    } else {
        /*
         * 預覽模式插入真正的 HTML 連結。
         * 真正識別依據是 data-card-id，
         * 標題只負責顯示。
         */
        const link =
            document.createElement('a');

        link.href =
            `#card/${encodeURIComponent(cardId)}`;

        link.className =
            'internal-card-link';

        link.dataset.cardId = cardId;
        link.contentEditable = 'false';
        link.textContent = title;
        link.title = `開啟卡片：${title}`;

        replaceRange.insertNode(link);

        /*
         * 在連結後加空白，讓使用者可以繼續輸入。
         */
        const space =
            document.createTextNode('\u00a0');

// 處理上下鍵、Enter、Esc
function handleCardLinkAutocompleteKeydown(event) {
    if (!cardLinkAutocompleteState.open) {
        return;
    }

    if (event.key === 'ArrowDown') {
        event.preventDefault();
        event.stopPropagation();

        moveCardLinkAutocomplete(1);
        return;
    }

    if (event.key === 'ArrowUp') {
        event.preventDefault();
        event.stopPropagation();

        moveCardLinkAutocomplete(-1);
        return;
    }

    if (event.key === 'Enter') {
        if (
            cardLinkAutocompleteState
                .results.length === 0
        ) {
            return;
        }

        event.preventDefault();
        event.stopPropagation();

        insertCardLinkFromAutocomplete(
            cardLinkAutocompleteState
                .selectedIndex
        );

        return;
    }

    if (event.key === 'Escape') {
        event.preventDefault();
        event.stopPropagation();

        closeCardLinkAutocomplete();
    }
}

// ===== 將編輯器 HTML 轉回 Markdown =====
function convertHtmlToMarkdown(html) {
    const temp = document.createElement('div');
    temp.innerHTML = html;

    function nodeToMarkdown(node, listDepth = 0) {
        // 純文字
        if (node.nodeType === Node.TEXT_NODE) {
            return node.textContent;
        }

        if (node.nodeType !== Node.ELEMENT_NODE) {
            return '';
        }

        const tag = node.tagName.toLowerCase();

        const children = Array.from(node.childNodes)
            .map(child => nodeToMarkdown(child, listDepth))
            .join('');

        switch (tag) {
            case 'h1':
                return `# ${children.trim()}\n\n`;

            case 'h2':
                return `## ${children.trim()}\n\n`;

            case 'h3':
                return `### ${children.trim()}\n\n`;

            case 'h4':
                return `#### ${children.trim()}\n\n`;

            case 'h5':
                return `##### ${children.trim()}\n\n`;

            case 'h6':
                return `###### ${children.trim()}\n\n`;

            case 'strong':
            case 'b':
                return `**${children}**`;

            case 'em':
            case 'i':
                return `*${children}*`;

            case 'u':
                // Markdown 沒有標準底線語法，保留 HTML
                return `<u>${children}</u>`;

            case 'del':
            case 's':
            case 'strike':
                return `~~${children}~~`;

            case 'code':
                // pre 裡面的 code 由 pre 處理
                if (node.parentElement?.tagName.toLowerCase() === 'pre') {
                    return node.textContent;
                }

                return `\`${node.textContent}\``;

            case 'pre':
                return `\`\`\`\n${node.textContent.trim()}\n\`\`\`\n\n`;

            case 'blockquote':
                return node.innerText
                    .split('\n')
                    .map(line => `> ${line}`)
                    .join('\n') + '\n\n';

            case 'a': {
    /*
     * 內部卡片連結保留成：
     * [[顯示標題|cardId]]
     */
    const cardId =
        node.dataset.cardId;

    if (
        node.classList.contains(
            'internal-card-link'
        ) &&
        cardId
    ) {
        return (
            `[[${children}|` +
            `${normalizeCardId(cardId)}]]`
        );
    }

    // 一般網址連結維持 Markdown 格式
    const href =
        node.getAttribute('href') || '';

    return `[${children}](${href})`;
}

            case 'img': {
                const src = node.getAttribute('src') || '';
                const alt = node.getAttribute('alt') || '圖片';
                return `![${alt}](${src})\n\n`;
            }

            case 'hr':
                return '---\n\n';

            case 'br':
                return '\n';

            case 'p':
                return `${children.trim()}\n\n`;

            case 'div':
                return `${children.trim()}\n`;

            case 'ul':
                return (
                    Array.from(node.children)
                        .map(li => {
                            const liText = Array.from(li.childNodes)
                                .filter(child => {
                                    return !(
                                        child.nodeType === Node.ELEMENT_NODE &&
                                        ['ul', 'ol'].includes(
                                            child.tagName.toLowerCase()
                                        )
                                    );
                                })
                                .map(child => nodeToMarkdown(child, listDepth + 1))
                                .join('')
                                .trim();

                            const nestedList = Array.from(li.children)
                                .filter(child =>
                                    ['ul', 'ol'].includes(
                                        child.tagName.toLowerCase()
                                    )
                                )
                                .map(child =>
                                    nodeToMarkdown(child, listDepth + 1)
                                )
                                .join('');

                            return (
                                `${'  '.repeat(listDepth)}- ${liText}\n` +
                                nestedList
                            );
                        })
                        .join('') + '\n'
                );

            case 'ol':
                return (
                    Array.from(node.children)
                        .map((li, index) => {
                            const liText = Array.from(li.childNodes)
                                .filter(child => {
                                    return !(
                                        child.nodeType === Node.ELEMENT_NODE &&
                                        ['ul', 'ol'].includes(
                                            child.tagName.toLowerCase()
                                        )
                                    );
                                })
                                .map(child => nodeToMarkdown(child, listDepth + 1))
                                .join('')
                                .trim();

                            const nestedList = Array.from(li.children)
                                .filter(child =>
                                    ['ul', 'ol'].includes(
                                        child.tagName.toLowerCase()
                                    )
                                )
                                .map(child =>
                                    nodeToMarkdown(child, listDepth + 1)
                                )
                                .join('');

                            return (
                                `${'  '.repeat(listDepth)}${index + 1}. ${liText}\n` +
                                nestedList
                            );
                        })
                        .join('') + '\n'
                );

            case 'li':
                return children;

            case 'input':
    if (node.type === 'checkbox') {
        return node.checked ? '- [x] ' : '- [ ] ';
    }

    return '';

case 'table':
    return convertTableToMarkdown(node) + '\n\n';

default:
    return children;
        }
    }

    let markdown = Array.from(temp.childNodes)
        .map(node => nodeToMarkdown(node))
        .join('');

    return markdown
        .replace(/\u00a0/g, ' ')
        .replace(/[ \t]+\n/g, '\n')
        .replace(/\n{3,}/g, '\n\n')
        .trim();
}


// ===== 將 HTML 表格轉換成 Markdown 表格 =====
function convertTableToMarkdown(table) {
    const rows = Array.from(table.querySelectorAll('tr'));

    if (rows.length === 0) {
        return '';
    }

    const markdownRows = rows.map(row => {
        const cells = Array.from(
            row.querySelectorAll(':scope > th, :scope > td')
        );

        return cells.map(cell => {
            return cell.innerText
                .trim()
                .replace(/\|/g, '\\|')
                .replace(/\n/g, '<br>');
        });
    });

    if (markdownRows.length === 0) {
        return '';
    }

    const columnCount = Math.max(
        ...markdownRows.map(row => row.length)
    );

    markdownRows.forEach(row => {
        while (row.length < columnCount) {
            row.push('');
        }
    });

    const output = [];

    output.push(`| ${markdownRows[0].join(' | ')} |`);
    output.push(`| ${Array(columnCount).fill('---').join(' | ')} |`);

    for (let i = 1; i < markdownRows.length; i++) {
        output.push(`| ${markdownRows[i].join(' | ')} |`);
    }

    return output.join('\n');
}

    function insertImage(input) {
      const file = input.files[0]; 
      if (!file) return;
      
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.src = e.target.result;
        img.onload = function() {
          const canvas = document.createElement('canvas');
          let MAX_WIDTH = 300;  // 縮小預設最大寬度
          let MAX_HEIGHT = 300; // 縮小預設最大高度
          let width = img.width;
          let height = img.height;

          // 等比例計算縮放尺寸
          if (width > height) {
            if (width > MAX_WIDTH) {
              height *= MAX_WIDTH / width;
              width = MAX_WIDTH;
            }
          } else {
            if (height > MAX_HEIGHT) {
              width *= MAX_HEIGHT / height;
              height = MAX_HEIGHT;
            }
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          // 第一階段：動態降低畫質
          let quality = 0.6;
          let compressedDataUrl = canvas.toDataURL('image/jpeg', quality);
          
          while (compressedDataUrl.length > 42000 && quality > 0.1) {
            quality -= 0.1;
            compressedDataUrl = canvas.toDataURL('image/jpeg', quality);
          }

          // 第二階段：如果降到最低畫質還是太大，直接縮小尺寸重新畫一次畫布
          if (compressedDataUrl.length > 42000) {
            MAX_WIDTH = 200;
            MAX_HEIGHT = 200;
            width = img.width;
            height = img.height;
            if (width > height) {
              height *= MAX_WIDTH / width;
              width = MAX_WIDTH;
            } else {
              width *= MAX_HEIGHT / height;
              height = MAX_HEIGHT;
            }
            canvas.width = width;
            canvas.height = height;
            ctx.clearRect(0, 0, width, height);
            ctx.drawImage(img, 0, 0, width, height);
            compressedDataUrl = canvas.toDataURL('image/jpeg', 0.4);
          }

          // 最終安全防線
          if (compressedDataUrl.length > 45000) {
            showToast('圖片檔案過大，無法壓縮至 Google 試算表限制內', 'error');
            input.value = '';
            return;
          }

          els.content.focus(); 
          document.execCommand('insertImage', false, compressedDataUrl); 
          setTimeout(() => document.querySelectorAll('.editor-content img').forEach(makeImageResizable), 100);
          showToast('圖片已強力壓縮並成功插入', 'success');
        };
      };
      reader.readAsDataURL(file); 
      input.value = '';
    }
